[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledmatrix"
version = "0.1.0"
description = "LED matrix render stack (Piomatter)"
readme = "README.md"
requires.python = ">=3.10"
dependecnies = [
    "numpy,
    "pillow",
    "adafruit_blinka_raspberry_pi5_piomatter",
]

[tools.setuptools]
package.dir = {"" = "src"}

[tool.setuptools.package.find]
where = ["src"]